[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transit"
version = "0.1.0"
description = "Learned spatiotemporal plausibility gating for cross-camera person re-identification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Albin", email = "albinmathew2004@gmail.com" }]

dependencies = [
    "ultralytics>=8.3.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    # torchreid (deep-person-reid) provides the pretrained OSNet feature extractor
    # used by reid/embedder.py. It is not consistently published to PyPI across
    # versions; if `pip install torchreid` fails, install from source instead:
    #   pip install git+https://github.com/KaiyangZhou/deep-person-reid.git
    "torchreid>=0.2.5",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    # Needed by run_detect_track.py's default Parquet output format
    # (scripts/run_detect_track.py --format parquet). Without this, the whole
    # detect+track stage runs to completion and then crashes writing output.
    "pyarrow>=14.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
